<script>
const T={"en": {"name": "English", "h": "Thank you for visiting AFRICA EYEWEAR!", "p": "If you have a moment, please share your honest experience on Google Maps.", "b1": "Write a review on Google", "n1": "Posting a review requires signing in with a Google account.", "b2": "Open our store in Google Maps", "n2": "Opens without signing in. Tap “Reviews” → “Write a review”."}, "zh-Hans": {"name": "简体中文", "h": "感谢光临 AFRICA EYEWEAR！", "p": "方便的话，欢迎在谷歌地图分享您的真实体验。", "b1": "在谷歌撰写评价", "n1": "发布评价需要登录谷歌账号。", "b2": "在谷歌地图打开本店", "n2": "无需登录即可打开。点「评价」→「撰写评价」。"}, "zh-Hant": {"name": "繁體中文", "h": "感謝光臨 AFRICA EYEWEAR！", "p": "方便的話，歡迎在 Google 地圖分享您的真實體驗。", "b1": "在 Google 撰寫評論", "n1": "發布評論需要登入 Google 帳戶。", "b2": "在 Google 地圖開啟本店", "n2": "不需登入即可開啟。點「評論」→「撰寫評論」。"}, "ja": {"name": "日本語", "h": "AFRICA EYEWEAR にご来店ありがとうございます！", "p": "よろしければ、Google マップにご感想をお寄せください。", "b1": "Google でクチコミを書く", "n1": "投稿には Google アカウントへのログインが必要です。", "b2": "Google マップで店舗を開く", "n2": "ログインなしで開けます。「クチコミ」→「クチコミを書く」をタップ。"}, "ko": {"name": "한국어", "h": "아프리카안경을 찾아 주셔서 감사합니다!", "p": "괜찮으시다면 솔직한 후기를 남겨 주세요.", "b1": "구글에 리뷰 쓰기", "n1": "리뷰를 올리려면 구글 계정 로그인이 필요해요.", "b2": "구글 지도에서 매장 보기", "n2": "로그인 없이 열려요. '리뷰' → '리뷰 작성'을 누르세요.", "b3": "네이버에 리뷰 쓰기", "n3": "네이버 지도 앱에서 영수증 인증으로 쓸 수 있어요."}, "vi": {"name": "Tiếng Việt", "h": "Cảm ơn bạn đã ghé AFRICA EYEWEAR!", "p": "Nếu tiện, hãy chia sẻ trải nghiệm thật của bạn trên Google Maps.", "b1": "Viết đánh giá trên Google", "n1": "Cần đăng nhập tài khoản Google để đăng đánh giá.", "b2": "Mở cửa hàng trên Google Maps", "n2": "Mở được mà không cần đăng nhập. Chạm “Bài đánh giá” → “Viết bài đánh giá”."}, "th": {"name": "ไทย", "h": "ขอบคุณที่แวะมาที่ AFRICA EYEWEAR!", "p": "หากสะดวก รบกวนเล่าประสบการณ์จริงของคุณบน Google Maps", "b1": "เขียนรีวิวบน Google", "n1": "ต้องลงชื่อเข้าใช้บัญชี Google เพื่อโพสต์รีวิว", "b2": "เปิดร้านใน Google Maps", "n2": "เปิดได้โดยไม่ต้องลงชื่อเข้าใช้ แตะ “รีวิว” → “เขียนรีวิว”"}, "id": {"name": "Bahasa Indonesia", "h": "Terima kasih sudah berkunjung ke AFRICA EYEWEAR!", "p": "Jika sempat, bagikan pengalaman jujur Anda di Google Maps.", "b1": "Tulis ulasan di Google", "n1": "Untuk memposting ulasan, Anda perlu masuk ke akun Google.", "b2": "Buka toko kami di Google Maps", "n2": "Bisa dibuka tanpa masuk. Ketuk “Ulasan” → “Tulis ulasan”."}};
function pick(){
  const q=new URLSearchParams(location.search).get('lang'); if(q&&T[q]) return q;
  for(const raw of (navigator.languages||[navigator.language||'en'])){
    const l=(raw||'').toLowerCase();
    if(/^zh-(tw|hk|mo|hant)/.test(l)) return 'zh-Hant';
    if(l.startsWith('zh')) return 'zh-Hans';
    if(l.startsWith('in')) return 'id';
    const b=l.split('-')[0]; if(T[b]) return b;
  }
  return 'en';
}
function show(k){
  const t=T[k]; document.documentElement.lang=k;
  for(const id of ['h','p','b1','n1','b2','n2']) document.getElementById(id).textContent=t[id];
  const kr=document.getElementById('kr'); kr.hidden=!t.b3;
  if(t.b3){document.getElementById('b3').textContent=t.b3;document.getElementById('n3').textContent=t.n3;}
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===k));
}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.l)));
show(pick());
</script>
